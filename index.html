<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>소비 대시보드</title>
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#182033;
      --muted:#7b8494;
      --line:#e7e9ee;
      --accent:#2f6fed;
      --accent-soft:#eef4ff;
      --danger:#d94b4b;
      --success:#2d8b62;
      --shadow:0 8px 24px rgba(15,23,42,.05);
      --radius:16px;
      --c1:#2f6fed;
      --c2:#7aa2ff;
      --c3:#86c7b4;
      --c4:#f0b86f;
      --c5:#a995d8;
      --c6:#d9dde6;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 52px}

    /* Header */
    .header{
      display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
      margin-bottom:16px;
    }
    h1{margin:0 0 5px;font-size:25px;letter-spacing:-.5px}
    .sub{font-size:12px;color:var(--muted)}
    .header-actions{display:flex;align-items:center;gap:8px}
    .small-btn{
      height:34px;padding:0 11px;border:1px solid var(--line);border-radius:9px;
      background:#fff;color:#3d4654;font-size:12px;font-weight:700;
    }
    .small-btn.active{background:var(--accent-soft);border-color:#cfe0ff;color:var(--accent)}

    /* Month nav */
    .month-nav{
      display:flex;justify-content:center;align-items:center;gap:10px;
      margin-bottom:14px;
    }
    .month-nav button{
      width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:9px;
      color:#536071;font-size:18px;line-height:1;
    }
    .month-label{
      min-width:145px;text-align:center;font-size:19px;font-weight:800;letter-spacing:-.3px;
    }

    /* Compact summary */
    .summary{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);
      display:grid;grid-template-columns:minmax(220px,35%) 1fr;
      gap:28px;padding:20px 24px 16px;margin-bottom:14px;
    }
    .donut-area{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:160px;
    }
    .donut{
      width:140px;height:140px;border-radius:50%;
      position:relative;background:conic-gradient(var(--c6) 0 100%);
      flex:0 0 auto;
    }
    .donut::after{
      content:"";position:absolute;inset:23px;background:#fff;border-radius:50%;
    }
    .donut-center{
      position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;text-align:center;
      padding:18px;
    }
    .donut-center .amount{font-size:17px;font-weight:800;letter-spacing:-.4px}
    .donut-center .caption{font-size:10px;color:var(--muted);margin-top:3px}
    .donut-caption{font-size:10px;color:var(--muted);margin-top:8px}

    .kpis{
      display:grid;grid-template-columns:1fr 1fr;column-gap:30px;row-gap:16px;
      align-content:center;padding:6px 0;
    }
    .kpi{
      padding:0;background:transparent;border:0;
    }
    .kpi.primary{
      grid-column:1/-1;
      padding-bottom:14px;
      border-bottom:1px solid var(--line);
    }
    .kpi-label{font-size:11px;color:var(--muted);margin-bottom:5px}
    .kpi-value{font-size:20px;font-weight:800;letter-spacing:-.35px}
    .kpi.primary .kpi-value{font-size:29px;letter-spacing:-.7px}
    .kpi-note{font-size:10px;color:var(--muted);margin-top:4px}
    .legend{
      grid-column:1/-1;
      display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
      padding-top:12px;margin-top:2px;border-top:1px solid var(--line);
    }
    .legend-row{
      display:flex;align-items:center;gap:5px;font-size:10px;color:#596373;
    }
    .legend-dot{width:7px;height:7px;border-radius:50%}
    .legend-name{white-space:nowrap}
    .legend-val{font-weight:800;color:#3d4654}
    .down{color:var(--success)}
    .up{color:var(--danger)}


    .summary-action{
      display:inline-flex;align-items:center;gap:5px;
      margin-top:10px;padding:0;border:0;background:transparent;
      color:var(--accent);font-size:11px;font-weight:800;cursor:pointer;
    }
    .summary-action:hover{text-decoration:underline}

    /* Category modal */
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(15,23,42,.34);
      display:none;align-items:center;justify-content:center;
      padding:20px;z-index:1000;
    }
    .modal-backdrop.show{display:flex}
    .modal-card{
      width:min(620px,100%);
      max-height:min(78vh,720px);
      overflow:auto;
      background:#fff;border-radius:18px;
      box-shadow:0 24px 70px rgba(15,23,42,.20);
      border:1px solid var(--line);
    }
    .modal-head{
      position:sticky;top:0;z-index:2;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:17px 18px 13px;background:#fff;border-bottom:1px solid var(--line);
    }
    .modal-head h2{margin:0;font-size:17px}
    .modal-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .modal-close{
      width:32px;height:32px;border:1px solid var(--line);border-radius:9px;
      background:#fff;color:#596373;font-size:18px;line-height:1;
    }
    .modal-body{padding:16px 18px 20px}
    .modal-total{
      display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
      margin-bottom:16px;padding:13px 14px;border-radius:12px;background:#fafbfc;
    }
    .modal-total .t{font-size:11px;color:var(--muted)}
    .modal-total .v{font-size:22px;font-weight:800;letter-spacing:-.4px}
    .modal-total .n{font-size:11px;color:var(--muted)}
    .modal-bars{display:flex;flex-direction:column;gap:12px}
    .modal-bar-row{
      display:grid;grid-template-columns:100px 1fr 92px 66px;gap:9px;align-items:center;
    }
    .modal-bar-name{
      font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .modal-bar-track{
      height:9px;background:#eef1f5;border-radius:999px;overflow:hidden;
    }
    .modal-bar-fill{height:100%;background:var(--accent);border-radius:999px}
    .modal-bar-amount{text-align:right;font-size:12px;font-weight:800}
    .modal-bar-diff{text-align:right;font-size:10px;color:var(--muted)}
    .modal-bar-diff.up{color:var(--danger)}
    .modal-bar-diff.down{color:var(--success)}


    /* Compare panel */
    .compare-panel{
      display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
    }
    .compare-panel.show{display:block}
    .compare-head{
      display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;
    }
    .compare-head h2{font-size:15px;margin:0}
    .compare-note{font-size:11px;color:var(--muted)}
    .compare-summary{
      display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px;
    }
    .compare-chip{
      border:1px solid #eef0f4;background:#fbfcfe;border-radius:10px;padding:10px 12px;
    }
    .compare-chip .t{font-size:10px;color:var(--muted)}
    .compare-chip .v{font-size:15px;font-weight:800;margin-top:4px}
    .compare-table-wrap{overflow:auto}
    .compare-table{
      width:100%;border-collapse:collapse;min-width:520px;
    }
    .compare-table th,.compare-table td{
      padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px;
    }
    .compare-table th{background:#fafbfc;color:#596373;text-align:left}
    .compare-table .num{text-align:right;font-variant-numeric:tabular-nums}

    /* category list */
    .category-panel{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:15px 16px;margin-bottom:14px;
    }
    .panel-head{
      display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px;
    }
    .panel-head h2{font-size:15px;margin:0}
    .small{font-size:11px;color:var(--muted)}
    .bars{display:flex;flex-direction:column;gap:9px}
    .bar-row{
      display:grid;grid-template-columns:100px 1fr 86px 64px;gap:9px;align-items:center;
    }
    .bar-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bar-track{height:8px;background:#eef1f5;border-radius:999px;overflow:hidden}
    .bar-fill{height:100%;background:var(--accent);border-radius:999px}
    .bar-amount{text-align:right;font-size:12px;font-weight:700}
    .bar-diff{text-align:right;font-size:10px;color:var(--muted)}
    .bar-diff.up{color:var(--danger)}
    .bar-diff.down{color:var(--success)}

    /* transactions */
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:15px 16px;
    }
    .table-toolbar{
      display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
      margin-bottom:9px;
    }
    .toolbar-left,.toolbar-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .icon-btn{
      width:33px;height:33px;border:1px solid var(--line);border-radius:9px;
      background:#fff;color:#374151;font-size:19px;font-weight:700;
      display:inline-flex;align-items:center;justify-content:center;
    }
    .icon-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .compact-input,.compact-select{
      height:33px;border:1px solid var(--line);border-radius:9px;background:#fff;
      padding:0 9px;font-size:11px;color:var(--text);outline:none;
    }
    .compact-input{width:150px}
    .compact-select{width:118px}
    .compact-input:focus,.compact-select:focus{
      border-color:#a9bff5;box-shadow:0 0 0 3px rgba(47,111,237,.08)
    }

    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{
      padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;
    }
    th{
      background:#fafbfc;color:#515b6b;font-weight:700;position:sticky;top:0;z-index:1;
      user-select:none;
    }
    th.sortable{cursor:pointer}
    th.sortable:hover{background:#f4f6f8}
    th.amount,td.amount{text-align:right}
    td.amount{font-weight:700;font-variant-numeric:tabular-nums}
    td.actions{text-align:right;white-space:nowrap}
    .pill{
      display:inline-flex;padding:4px 7px;border-radius:999px;background:#f3f4f6;
      color:#4b5563;font-size:10px;
    }
    .total-row td{font-weight:800;background:#fbfcff}
    .mini-btn{
      height:29px;padding:0 8px;border:1px solid var(--line);border-radius:8px;
      background:#fff;color:#424b59;font-size:11px;font-weight:700;
    }
    .mini-btn.danger{color:var(--danger);background:#fff8f8}
    .inline-row td{background:#fbfdff}
    .cell-input{
      width:100%;height:32px;border:1px solid #cfd5df;border-radius:8px;
      padding:0 8px;font-size:11px;background:#fff;outline:none;
    }
    .cell-input:focus{border-color:#9ab6f2;box-shadow:0 0 0 2px rgba(47,111,237,.08)}
    .amount-input{text-align:right}
    .inline-actions{display:flex;justify-content:flex-end;gap:5px}
    .empty{text-align:center;color:var(--muted);padding:26px}

    @media(max-width:820px){
      .summary{grid-template-columns:1fr}
      .donut-area{justify-content:center}
      .kpis{grid-template-columns:repeat(2,1fr);column-gap:18px}
      .legend{grid-column:1}
      .compare-summary{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .wrap{padding:18px 12px 40px}
      .header{flex-direction:column}
      .header-actions{width:100%;justify-content:flex-end}
      .summary{padding:15px}
      .donut-area{gap:10px}
      .donut{width:118px;height:118px}
      .donut::after{inset:20px}
      .kpi-value{font-size:17px}
      .bar-row{grid-template-columns:78px 1fr 74px}
      .bar-diff{display:none}
      .modal-bar-row{grid-template-columns:78px 1fr 76px}
      .modal-bar-diff{display:none}
      .toolbar-right{width:100%}
      .compact-input{flex:1;min-width:130px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div>
      <h1>소비 대시보드</h1>
      <div class="sub">월별 소비를 한 곳에서 관리하고 비교합니다.</div>
    </div>
    <div class="header-actions">
      <button id="compareBtn" class="small-btn" type="button">월 비교</button>
      <button id="exportBtn" class="small-btn" type="button">CSV</button>
    </div>
  </header>

  <div class="month-nav">
    <button id="prevMonthBtn" type="button" aria-label="이전 달">‹</button>
    <div id="monthLabel" class="month-label">2026년 9월</div>
    <button id="nextMonthBtn" type="button" aria-label="다음 달">›</button>
  </div>

  <section class="summary">
    <div class="donut-area">
      <div class="donut" id="donut">
        <div class="donut-center">
          <div id="donutAmount" class="amount">-</div>
          <div class="caption">가장 큰 비중</div>
        </div>
      </div>
      <div class="donut-caption">카테고리 구성</div>
      <button id="openCategoryBtn" class="summary-action" type="button">카테고리 상세 보기 ›</button>
    </div>

    <div class="kpis">
      <div class="kpi primary">
        <div class="kpi-label">이번 달 소비</div>
        <div id="totalKpi" class="kpi-value">0원</div>
        <div id="countKpi" class="kpi-note">0건</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">하루 평균</div>
        <div id="dailyAvgKpi" class="kpi-value">0원</div>
        <div id="dailyAvgNote" class="kpi-note">선택 월 경과일 기준</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">전월 동기간 대비</div>
        <div id="compareKpi" class="kpi-value">-</div>
        <div id="compareKpiNote" class="kpi-note">비교 데이터 없음</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">가장 큰 지출</div>
        <div id="topCategoryKpi" class="kpi-value">-</div>
        <div id="topCategoryNote" class="kpi-note">-</div>
      </div>
      <div></div>
    </div>

    <div id="legend" class="legend"></div>
  </section>

  <section id="comparePanel" class="compare-panel">
    <div class="compare-head">
      <h2>월 비교</h2>
      <div id="comparePanelNote" class="compare-note"></div>
    </div>
    <div class="compare-summary">
      <div class="compare-chip">
        <div class="t">선택 월</div>
        <div id="compareCurrentTotal" class="v">0원</div>
      </div>
      <div class="compare-chip">
        <div class="t">전월 동일 기간</div>
        <div id="comparePrevTotal" class="v">0원</div>
      </div>
      <div class="compare-chip">
        <div class="t">증감</div>
        <div id="compareDiffTotal" class="v">-</div>
      </div>
    </div>
    <div class="compare-table-wrap">
      <table class="compare-table">
        <thead>
          <tr>
            <th>카테고리</th>
            <th class="num">전월</th>
            <th class="num">선택 월</th>
            <th class="num">증감</th>
          </tr>
        </thead>
        <tbody id="compareTbody"></tbody>
      </table>
    </div>
  </section>

  <div id="categoryModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
      <div class="modal-head">
        <div>
          <h2 id="categoryModalTitle">카테고리별 소비</h2>
          <div id="categoryModalSub" class="modal-sub">전월 동기간과 비교</div>
        </div>
        <button id="closeCategoryBtn" class="modal-close" type="button" aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-total">
          <div>
            <div class="t">선택 월 총 소비</div>
            <div id="categoryModalTotal" class="v">0원</div>
          </div>
          <div id="categoryModalCount" class="n">0건</div>
        </div>
        <div id="categoryModalBars" class="modal-bars"></div>
      </div>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>소비 내역</h2>
      <span class="small">+ 버튼으로 바로 추가</span>
    </div>

    <div class="table-toolbar">
      <div class="toolbar-left">
        <button id="addRowBtn" class="icon-btn primary" type="button" title="내역 추가">+</button>
        <span id="resultInfo" class="small"></span>
      </div>
      <div class="toolbar-right">
        <select id="categoryFilter" class="compact-select">
          <option value="">전체 카테고리</option>
        </select>
        <input id="searchFilter" class="compact-input" type="text" placeholder="검색" />
        <button id="resetFilterBtn" class="mini-btn" type="button">초기화</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-sort="date">일자 <span class="sort-mark"></span></th>
            <th class="sortable" data-sort="category">카테고리 <span class="sort-mark"></span></th>
            <th class="sortable" data-sort="item">항목 <span class="sort-mark"></span></th>
            <th class="sortable amount" data-sort="amount">금액 <span class="sort-mark"></span></th>
            <th style="text-align:right">관리</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr class="total-row">
            <td colspan="3">합계</td>
            <td id="tableTotal" class="amount">0원</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div style="display:flex;justify-content:flex-end;margin-top:9px">
      <button id="restoreBtn" class="mini-btn" type="button">초기 데이터 복원</button>
    </div>
  </section>
</div>

<script>

  const OLD_KEYS = [

    {id:16, date:"2026-09-13", category:"식비", item:"지인 송금", amount:4700},
    {id:17, date:"2026-09-15", category:"식비", item:"점심 이체", amount:14600},
    {id:18, date:"2026-09-15", category:"카페·간식", item:"쿠모쿠모베이커리", amount:12700},
    {id:19, date:"2026-09-15", category:"카페·간식", item:"마시쩡", amount:600}
  ];

  const $ = id => document.getElementById(id);
  const fmt = n => Number(n||0).toLocaleString("ko-KR")+"원";
  const shortDate = iso => {
    const [,m,d] = iso.split("-");
    return `${Number(m)}/${Number(d)}`;
  };
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
  const pad = n => String(n).padStart(2,"0");

  function loadData(){
    try{
      const saved = localStorage.getItem(STORAGE_KEY);
      if(saved) return JSON.parse(saved);

      for(const key of OLD_KEYS){
        const legacy = localStorage.getItem(key);
        if(legacy){
          const parsed = JSON.parse(legacy);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
          return parsed;
        }
      }
    }catch(e){}
    return structuredClone(DEFAULT_DATA);
  }

  let entries = loadData();
  let selectedYear = 2026;
  let selectedMonth = 9; // 1~12
  let editingId = null;
  let isAdding = false;
  let sortKey = "date";
  let sortDir = "asc";
  let compareOpen = false;

  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }

  function monthKey(year, month){
    return `${year}-${pad(month)}`;
  }

  function shiftMonth(year, month, delta){
    const d = new Date(year, month-1+delta, 1);
    return {year:d.getFullYear(), month:d.getMonth()+1};
  }

  function daysInMonth(year, month){
    return new Date(year, month, 0).getDate();
  }

  function selectedMonthRows(){
    const key = monthKey(selectedYear, selectedMonth);
    return entries.filter(x => x.date.startsWith(key));
  }

  function currentPeriodEndDay(){
    const now = new Date();
    const isCurrentMonth = now.getFullYear()===selectedYear && (now.getMonth()+1)===selectedMonth;
    if(isCurrentMonth) return now.getDate();

    const rows = selectedMonthRows();
    if(!rows.length) return daysInMonth(selectedYear, selectedMonth);
    return Math.max(...rows.map(x=>Number(x.date.slice(8,10))));
  }

  function previousPeriodRows(){
    const prev = shiftMonth(selectedYear, selectedMonth, -1);
    const endDay = Math.min(currentPeriodEndDay(), daysInMonth(prev.year, prev.month));
    const prefix = monthKey(prev.year, prev.month);
    return entries.filter(x => x.date.startsWith(prefix) && Number(x.date.slice(8,10)) <= endDay);
  }

  function categoryTotals(rows){
    const out = {};
    rows.forEach(x => out[x.category] = (out[x.category]||0) + Number(x.amount));
    return out;
  }

  function filteredRows(){
    const q = $("searchFilter").value.trim().toLowerCase();
    const cat = $("categoryFilter").value;

    const rows = selectedMonthRows().filter(x=>{
      const hay = `${x.category} ${x.item}`.toLowerCase();
      return (!q || hay.includes(q)) && (!cat || x.category===cat);
    });

    return rows.sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(sortKey==="amount"){av=Number(av);bv=Number(bv)}
      if(typeof av==="string") return av.localeCompare(bv,"ko")*(sortDir==="asc"?1:-1);
      return (av-bv)*(sortDir==="asc"?1:-1);
    });
  }

  function allCategories(){
    return [...new Set(entries.map(x=>x.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ko"));
  }

  function updateCategoryFilter(){
    const cur = $("categoryFilter").value;
    $("categoryFilter").innerHTML =
      '<option value="">전체 카테고리</option>' +
      allCategories().map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    if([...$("categoryFilter").options].some(o=>o.value===cur)) $("categoryFilter").value = cur;
  }

  function renderMonthLabel(){
    $("monthLabel").textContent = `${selectedYear}년 ${selectedMonth}월`;
  }

  function renderSummary(){
    const rows = selectedMonthRows();
    const total = rows.reduce((s,x)=>s+Number(x.amount),0);
    const count = rows.length;
    const prevRows = previousPeriodRows();
    const prevTotal = prevRows.reduce((s,x)=>s+Number(x.amount),0);

    const endDay = currentPeriodEndDay();
    const dailyAvg = endDay ? Math.round(total/endDay) : 0;

    const cats = categoryTotals(rows);
    const sortedCats = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
    const top = sortedCats[0] || ["-",0];

    $("totalKpi").textContent = fmt(total);
    $("countKpi").textContent = `${count}건`;
    $("dailyAvgKpi").textContent = fmt(dailyAvg);
    $("dailyAvgNote").textContent = `1~${endDay}일 기준`;
    $("topCategoryKpi").textContent = top[0];
    $("topCategoryNote").textContent = top[1] ? fmt(top[1]) : "-";
    const topPct = total && top[1] ? Math.round((top[1]/total)*100) : 0;
    $("donutAmount").textContent = top[1] ? `${top[0]} ${topPct}%` : "-";

    if(prevTotal > 0){
      const pct = ((total-prevTotal)/prevTotal)*100;
      const absPct = Math.abs(pct).toFixed(1);
      const cls = pct > 0 ? "up" : pct < 0 ? "down" : "";
      $("compareKpi").className = `kpi-value ${cls}`;
      $("compareKpi").textContent = `${pct>0?"▲":pct<0?"▼":""} ${absPct}%`;
      $("compareKpiNote").textContent = `${fmt(prevTotal)} 대비`;
    }else{
      $("compareKpi").className = "kpi-value";
      $("compareKpi").textContent = "-";
      $("compareKpiNote").textContent = "비교 데이터 없음";
    }

    renderDonut(sortedCats,total);
  }

  function renderDonut(sortedCats,total){
    const colors = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c6)"];
    if(!total || !sortedCats.length){
      $("donut").style.background = "conic-gradient(var(--c6) 0 100%)";
      $("legend").innerHTML = `<div class="small">표시할 데이터가 없습니다.</div>`;
      return;
    }

    // 상위 4개 + 나머지는 기타로 묶어 도넛 조각 수를 줄임
    const displayCats = sortedCats.slice(0,4);
    if(sortedCats.length>4){
      const rest = sortedCats.slice(4).reduce((s,x)=>s+x[1],0);
      displayCats.push(["기타",rest]);
    }

    let cursor=0;
    const segments=[];
    displayCats.forEach(([name,val],idx)=>{
      const pct=(val/total)*100;
      const start=cursor;
      const end=cursor+pct;
      segments.push(`${colors[idx%colors.length]} ${start}% ${end}%`);
      cursor=end;
    });
    $("donut").style.background = `conic-gradient(${segments.join(",")})`;

    $("legend").innerHTML = displayCats.map(([name,val],idx)=>{
      const pct=Math.round((val/total)*100);
      return `<div class="legend-row">
        <span class="legend-dot" style="background:${colors[idx%colors.length]}"></span>
        <span class="legend-name">${escapeHtml(name)}</span>
        <span class="legend-val">${pct}%</span>
      </div>`;
    }).join("");
  }

  function renderCategoryModal(){
    const rows = selectedMonthRows();
    const prevRows = previousPeriodRows();
    const curr = categoryTotals(rows);
    const prev = categoryTotals(prevRows);
    const sorted = Object.entries(curr).sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,x)=>s+Number(x.amount),0);

    $("categoryModalTitle").textContent = `${selectedYear}년 ${selectedMonth}월 카테고리별 소비`;
    const prevMonth = shiftMonth(selectedYear, selectedMonth, -1);
    const endDay = currentPeriodEndDay();
    $("categoryModalSub").textContent =
      `${prevMonth.year}년 ${prevMonth.month}월 1~${Math.min(endDay,daysInMonth(prevMonth.year,prevMonth.month))}일 대비`;
    $("categoryModalTotal").textContent = fmt(total);
    $("categoryModalCount").textContent = `${rows.length}건`;

    const box = $("categoryModalBars");
    if(!sorted.length){
      box.innerHTML = `<div class="empty">표시할 데이터가 없습니다.</div>`;
      return;
    }

    const max = sorted[0][1] || 1;
    box.innerHTML = sorted.map(([name,val])=>{
      const diff = val - (prev[name]||0);
      const diffCls = diff>0 ? "up" : diff<0 ? "down" : "";
      const diffText = diff===0 ? "-" : `${diff>0?"▲":"▼"} ${Math.abs(diff).toLocaleString("ko-KR")}`;
      return `<div class="modal-bar-row">
        <div class="modal-bar-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
        <div class="modal-bar-track"><div class="modal-bar-fill" style="width:${Math.max(2,(val/max)*100)}%"></div></div>
        <div class="modal-bar-amount">${fmt(val)}</div>
        <div class="modal-bar-diff ${diffCls}">${diffText}</div>
      </div>`;
    }).join("");
  }

  function renderCompare(){
    $("comparePanel").classList.toggle("show", compareOpen);
    $("compareBtn").classList.toggle("active", compareOpen);

    const rows = selectedMonthRows();
    const prevRows = previousPeriodRows();
    const total = rows.reduce((s,x)=>s+Number(x.amount),0);
    const prevTotal = prevRows.reduce((s,x)=>s+Number(x.amount),0);
    const diff = total-prevTotal;
    const prev = shiftMonth(selectedYear, selectedMonth, -1);
    const endDay = currentPeriodEndDay();

    $("comparePanelNote").textContent =
      `${prev.year}년 ${prev.month}월 1~${Math.min(endDay,daysInMonth(prev.year,prev.month))}일 vs ${selectedYear}년 ${selectedMonth}월 1~${endDay}일`;
    $("compareCurrentTotal").textContent = fmt(total);
    $("comparePrevTotal").textContent = fmt(prevTotal);

    if(prevTotal>0){
      const pct=(diff/prevTotal)*100;
      $("compareDiffTotal").textContent = `${diff>0?"▲":diff<0?"▼":""} ${Math.abs(pct).toFixed(1)}%`;
      $("compareDiffTotal").className = `v ${diff>0?"up":diff<0?"down":""}`;
    }else{
      $("compareDiffTotal").textContent = "-";
      $("compareDiffTotal").className = "v";
    }

    const currCats = categoryTotals(rows);
    const prevCats = categoryTotals(prevRows);
    const names = [...new Set([...Object.keys(currCats),...Object.keys(prevCats)])]
      .sort((a,b)=>(currCats[b]||0)-(currCats[a]||0));

    $("compareTbody").innerHTML = names.length ? names.map(name=>{
      const c=currCats[name]||0;
      const p=prevCats[name]||0;
      const d=c-p;
      return `<tr>
        <td>${escapeHtml(name)}</td>
        <td class="num">${fmt(p)}</td>
        <td class="num">${fmt(c)}</td>
        <td class="num ${d>0?"up":d<0?"down":""}">
          ${d===0?"-":`${d>0?"▲":"▼"} ${Math.abs(d).toLocaleString("ko-KR")}원`}
        </td>
      </tr>`;
    }).join("") : `<tr><td colspan="4" class="empty">비교할 데이터가 없습니다.</td></tr>`;
  }

  function defaultNewDate(){
    const now = new Date();
    const sameMonth = now.getFullYear()===selectedYear && now.getMonth()+1===selectedMonth;
    const day = sameMonth ? now.getDate() : 1;
    return `${selectedYear}-${pad(selectedMonth)}-${pad(Math.min(day,daysInMonth(selectedYear,selectedMonth)))}`;
  }

  function addRowHtml(){
    return `
      <tr class="inline-row">
        <td><input id="newDate" class="cell-input" type="date" value="${defaultNewDate()}"></td>
        <td><input id="newCategory" class="cell-input" list="categoryListInline" placeholder="식비">
          <datalist id="categoryListInline">
            ${["식비","카페·간식","편의점","장보기","여가","뷰티","교통","구독·디지털","기타"].map(c=>`<option value="${c}"></option>`).join("")}
          </datalist>
        </td>
        <td><input id="newItem" class="cell-input" type="text" placeholder="항목 입력"></td>
        <td><input id="newAmount" class="cell-input amount-input" type="number" min="0" step="1" placeholder="0"></td>
        <td class="actions">
          <div class="inline-actions">
            <button class="mini-btn" type="button" onclick="saveNewRow()">저장</button>
            <button class="mini-btn danger" type="button" onclick="cancelAdd()">취소</button>
          </div>
        </td>
      </tr>`;
  }

  function editRowHtml(x){
    return `
      <tr class="inline-row">
        <td><input id="editDate" class="cell-input" type="date" value="${x.date}"></td>
        <td><input id="editCategory" class="cell-input" type="text" value="${escapeHtml(x.category)}"></td>
        <td><input id="editItem" class="cell-input" type="text" value="${escapeHtml(x.item)}"></td>
        <td><input id="editAmount" class="cell-input amount-input" type="number" min="0" step="1" value="${x.amount}"></td>
        <td class="actions">
          <div class="inline-actions">
            <button class="mini-btn" type="button" onclick="saveEdit(${x.id})">저장</button>
            <button class="mini-btn danger" type="button" onclick="cancelEdit()">취소</button>
          </div>
        </td>
      </tr>`;
  }

  function renderTable(){
    updateCategoryFilter();
    const rows = filteredRows();
    const total = rows.reduce((s,x)=>s+Number(x.amount),0);

    $("resultInfo").textContent = `${rows.length}건 · ${fmt(total)}`;
    $("tableTotal").textContent = fmt(total);

    const body=[];
    if(isAdding) body.push(addRowHtml());

    if(!rows.length && !isAdding){
      body.push(`<tr><td colspan="5" class="empty">이 달에는 소비 내역이 없습니다.</td></tr>`);
    }else{
      rows.forEach(x=>{
        if(editingId===x.id){
          body.push(editRowHtml(x));
        }else{
          body.push(`<tr>
            <td>${shortDate(x.date)}</td>
            <td><span class="pill">${escapeHtml(x.category)}</span></td>
            <td>${escapeHtml(x.item)}</td>
            <td class="amount">${fmt(x.amount)}</td>
            <td class="actions">
              <button class="mini-btn" type="button" onclick="startEdit(${x.id})">수정</button>
              <button class="mini-btn danger" type="button" onclick="removeEntry(${x.id})">삭제</button>
            </td>
          </tr>`);
        }
      });
    }
    $("tbody").innerHTML = body.join("");
    renderSortMarks();
  }

  function renderSortMarks(){
    document.querySelectorAll("th.sortable").forEach(th=>{
      th.querySelector(".sort-mark").textContent =
        th.dataset.sort===sortKey ? (sortDir==="asc"?"▲":"▼") : "";
    });
  }

  function renderAll(){
    renderMonthLabel();
    renderSummary();
    renderCompare();
    renderCategoryModal();
    renderTable();
  }

  function openCategoryModal(){
    renderCategoryModal();
    $("categoryModal").classList.add("show");
    $("categoryModal").setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
  }

  function closeCategoryModal(){
    $("categoryModal").classList.remove("show");
    $("categoryModal").setAttribute("aria-hidden","true");
    document.body.style.overflow="";
  }

  $("openCategoryBtn").addEventListener("click", openCategoryModal);
  $("closeCategoryBtn").addEventListener("click", closeCategoryModal);
  $("categoryModal").addEventListener("click", e=>{
    if(e.target === $("categoryModal")) closeCategoryModal();
  });
  document.addEventListener("keydown", e=>{
    if(e.key === "Escape" && $("categoryModal").classList.contains("show")){
      closeCategoryModal();
    }
  });

  $("prevMonthBtn").addEventListener("click",()=>{
    const p=shiftMonth(selectedYear,selectedMonth,-1);
    selectedYear=p.year; selectedMonth=p.month;
    isAdding=false; editingId=null;
    renderAll();
  });

  $("nextMonthBtn").addEventListener("click",()=>{
    const p=shiftMonth(selectedYear,selectedMonth,1);
    selectedYear=p.year; selectedMonth=p.month;
    isAdding=false; editingId=null;
    renderAll();
  });

  $("compareBtn").addEventListener("click",()=>{
    compareOpen=!compareOpen;
    renderCompare();
  });

  $("addRowBtn").addEventListener("click",()=>{
    editingId=null;
    isAdding=true;
    renderTable();
    setTimeout(()=>$("newItem")?.focus(),0);
  });

  function saveNewRow(){
    const date=$("newDate")?.value;
    const category=$("newCategory")?.value.trim();
    const item=$("newItem")?.value.trim();
    const amount=Number($("newAmount")?.value);
    if(!date || !category || !item || !Number.isFinite(amount) || amount<0){
      alert("일자, 카테고리, 항목, 금액을 모두 입력해 주세요.");
      return;
    }
    const id=entries.length?Math.max(...entries.map(x=>x.id))+1:1;
    entries.push({id,date,category,item,amount});
    saveData();
    isAdding=false;

    // newly added date's month becomes selected
    selectedYear=Number(date.slice(0,4));
    selectedMonth=Number(date.slice(5,7));
    renderAll();
  }

  function cancelAdd(){isAdding=false;renderTable()}

  function startEdit(id){
    isAdding=false;
    editingId=id;
    renderTable();
  }

  function saveEdit(id){
    const idx=entries.findIndex(x=>x.id===id);
    if(idx<0) return;
    const date=$("editDate")?.value;
    const category=$("editCategory")?.value.trim();
    const item=$("editItem")?.value.trim();
    const amount=Number($("editAmount")?.value);
    if(!date || !category || !item || !Number.isFinite(amount) || amount<0){
      alert("일자, 카테고리, 항목, 금액을 모두 입력해 주세요.");
      return;
    }
    entries[idx]={...entries[idx],date,category,item,amount};
    saveData();
    editingId=null;
    selectedYear=Number(date.slice(0,4));
    selectedMonth=Number(date.slice(5,7));
    renderAll();
  }

  function cancelEdit(){editingId=null;renderTable()}

  function removeEntry(id){
    const x=entries.find(e=>e.id===id);
    if(!x) return;
    if(!confirm(`${x.item} / ${fmt(x.amount)}\n삭제할까요?`)) return;
    entries=entries.filter(e=>e.id!==id);
    saveData();
    renderAll();
  }

  $("searchFilter").addEventListener("input",renderTable);
  $("categoryFilter").addEventListener("change",renderTable);
  $("resetFilterBtn").addEventListener("click",()=>{
    $("searchFilter").value="";
    $("categoryFilter").value="";
    renderTable();
  });

  document.querySelectorAll("th.sortable").forEach(th=>{
    th.addEventListener("click",()=>{
      const key=th.dataset.sort;
      if(sortKey===key) sortDir=sortDir==="asc"?"desc":"asc";
      else {sortKey=key;sortDir="asc"}
      renderTable();
    });
  });

  $("restoreBtn").addEventListener("click",()=>{
    if(!confirm("추가·수정한 내용을 모두 지우고 초기 데이터로 복원할까요?")) return;
    entries=structuredClone(DEFAULT_DATA);
    saveData();
    selectedYear=2026;selectedMonth=9;
    editingId=null;isAdding=false;
    renderAll();
  });

  $("exportBtn").addEventListener("click",()=>{
    const rows=[...entries].sort((a,b)=>a.date.localeCompare(b.date));
    const csvRows=[["일자","카테고리","항목","금액"],...rows.map(x=>[x.date,x.category,x.item,x.amount])];
    const csv="\uFEFF"+csvRows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="소비내역_전체.csv";
    a.click();
    URL.revokeObjectURL(url);
  });

  window.saveNewRow=saveNewRow;
  window.cancelAdd=cancelAdd;
  window.startEdit=startEdit;
  window.saveEdit=saveEdit;
  window.cancelEdit=cancelEdit;
  window.removeEntry=removeEntry;

  renderAll();
</script>
</body>
</html>
