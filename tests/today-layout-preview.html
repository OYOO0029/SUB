<!doctype html><html lang="ko"><meta charset="utf-8"><title>Today layout QA — synthetic local server only</title>
<style>body{margin:0;background:#101318;color:white;font:13px sans-serif}nav{padding:8px;display:flex;gap:8px}button{padding:6px 12px}iframe{display:block;border:0;height:900px;max-width:none;margin:0 auto;background:#191c23}</style>
<nav aria-label="검수 화면 너비"><button data-width="1280">1280px</button><button data-width="1024">1024px</button><button data-width="720">720px</button><button data-width="390">390px</button><button data-width="320">320px</button></nav>
<pre id="metrics" style="font-size:11px;white-space:pre-wrap;margin:8px;max-height:60px;overflow:auto"></pre><iframe title="가상 계정 업무 화면" style="width:1024px"></iframe>
<script>if(['127.0.0.1','localhost'].includes(location.hostname)){const frame=document.querySelector('iframe');frame.src='/work/index.html?embedded=1';function measure(){const d=frame.contentDocument,w=frame.contentWindow;if(!d.querySelector('.tt-table'))return;const rect=s=>{const r=d.querySelector(s).getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height}};document.querySelector('#metrics').textContent=JSON.stringify({viewport:w.innerWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,tabs:[...d.querySelectorAll('.flow-nav-link')].map(e=>({height:e.getBoundingClientRect().height,font:w.getComputedStyle(e).fontSize})),toolbar:rect('.tt-toolbar'),table:rect('.tt-table-wrap'),row:rect('.tt-table tbody tr'),icons:[...d.querySelectorAll('.tt-toolbar>div:last-child button')].map(e=>{const r=e.getBoundingClientRect(),i=e.querySelector('svg').getBoundingClientRect();return {box:[r.width,r.height],offset:[i.x+i.width/2-r.x-r.width/2,i.y+i.height/2-r.y-r.height/2]}})},null,1)}setInterval(measure,500);document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';measure()})}else document.querySelector('iframe').remove();</script></html>
